name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Apache-2.0 license surface
        run: bash scripts/check-license-surface.sh
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Enforce spec conformance
        run: python conformance/run_conformance.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel
      - name: Verify distribution metadata and license files
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile
          from pathlib import Path

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, f"expected one wheel, got {wheels}"
          assert len(sdists) == 1, f"expected one sdist, got {sdists}"

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              assert "Name: claimproofkit" in metadata
              assert "Version: 0.1.0" in metadata
              assert "License-Expression: Apache-2.0" in metadata or "License: Apache-2.0" in metadata
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), "wheel missing LICENSE"
              assert any(n.endswith(".dist-info/licenses/NOTICE") for n in names), "wheel missing NOTICE"
              assert any(n == "claimproofkit/cli.py" for n in names), "wheel missing CLI module"

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              assert any(n.endswith("/LICENSE") for n in names), "sdist missing LICENSE"
              assert any(n.endswith("/NOTICE") for n in names), "sdist missing NOTICE"
              assert any(n.endswith("/pyproject.toml") for n in names), "sdist missing pyproject.toml"
          print("wheel/sdist contents and Apache-2.0 metadata verified")
          PY
      - name: Install wheel into a clean virtual environment and smoke-test CLI
        run: |
          python -m venv /tmp/claimproofkit-wheel-test
          /tmp/claimproofkit-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          /tmp/claimproofkit-wheel-test/bin/python -m pip check
          /tmp/claimproofkit-wheel-test/bin/claimproofkit --help
          /tmp/claimproofkit-wheel-test/bin/python - <<'PY'
          from importlib.metadata import metadata, version
          import claimproofkit

          assert version("claimproofkit") == "0.1.0"
          package_metadata = metadata("claimproofkit")
          license_value = package_metadata.get("License-Expression") or package_metadata.get("License")
          assert license_value == "Apache-2.0", f"unexpected license metadata: {license_value!r}"
          print("clean wheel install, import, CLI, and Apache-2.0 metadata verified")
          PY
