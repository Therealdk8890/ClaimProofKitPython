[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimproofkit"
version = "0.1.0"
description = "Apache-2.0 licensed, evidence-bound claim verification that blocks generated documents whose material claims the supplied evidence does not support. Python implementation of Claim Proof Specification v1, in locked parity with the Swift reference implementation."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ClaimProofKit" }]
keywords = ["verification", "claims", "evidence", "hallucination", "provenance", "legal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# Pure standard library: json, hashlib, re, uuid, dataclasses.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Therealdk8890/ClaimProofKitPython"
Reference-Implementation = "https://github.com/Therealdk8890/ClaimProofKit"

[project.scripts]
claimproofkit = "claimproofkit.cli:main"

[tool.setuptools]
packages = ["claimproofkit"]

[tool.setuptools.package-data]
claimproofkit = ["py.typed"]
